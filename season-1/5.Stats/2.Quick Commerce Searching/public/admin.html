<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jaldi | The Late admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
      }
      .material-symbols-rounded {
        font-size: inherit;
        line-height: 1;
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div class="flex min-h-screen">
      <aside
        class="w-60 shrink-0 bg-white border-r border-slate-200 p-4 hidden md:flex flex-col gap-4 sticky top-0 h-screen"
      >
        <a
          href="/"
          aria-label="Jaldi, The Late admin"
          class="flex items-end gap-2 px-2 select-none"
        >
          <span class="inline-flex flex-col leading-none">
            <span class="text-3xl font-black tracking-tight"
              ><span class="text-amber-400">Jal</span
              ><span class="text-green-700">di</span></span
            >
            <span
              aria-hidden="true"
              class="flex justify-between mt-1 text-[10px] font-extrabold text-slate-500"
              ><span>T</span><span>H</span><span>E</span><span></span
              ><span>L</span><span>A</span><span>T</span><span>E</span></span
            >
          </span>
          <span class="text-sm font-semibold text-slate-500">admin</span>
        </a>
        <nav id="nav" class="flex flex-col gap-1"></nav>
        <div class="mt-auto text-xs text-slate-500 px-2 space-y-1">
          <p id="keyState"></p>
          <a href="/" class="block text-green-800 hover:underline"
            >Open the shop ↗</a
          >
          <a
            href="/api-docs"
            target="_blank"
            class="block text-green-800 hover:underline"
            >API docs ↗</a
          >
        </div>
      </aside>

      <div class="flex-1 min-w-0">
        <header
          class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200 px-6 py-3 flex flex-wrap items-center gap-3"
        >
          <a href="/admin" class="md:hidden font-extrabold text-green-700"
            >Jaldi</a
          >
          <h1 id="title" class="text-xl font-extrabold mr-auto"></h1>
          <div id="filters" class="flex flex-wrap items-center gap-2 text-sm">
            <label class="sr-only" for="range">Date range</label>
            <select
              id="range"
              class="border border-slate-300 rounded-xl px-3 py-1.5 bg-white"
            >
              <option value="today">Today</option>
              <option value="yesterday">Yesterday</option>
              <option value="7d">Last 7 days</option>
              <option value="30d">Last 30 days</option>
              <option value="month">This month</option>
              <option value="custom">Custom dates</option>
            </select>
            <span id="customDates" class="hidden items-center gap-1 flex">
              <input
                id="from"
                type="date"
                aria-label="From"
                class="border border-slate-300 rounded-xl px-2 py-1"
              />
              <span class="text-slate-400">to</span>
              <input
                id="to"
                type="date"
                aria-label="To"
                class="border border-slate-300 rounded-xl px-2 py-1"
              />
            </span>
            <label class="sr-only" for="city">City</label>
            <select
              id="city"
              class="border border-slate-300 rounded-xl px-3 py-1.5 bg-white"
            >
              <option value="">All cities</option>
            </select>
          </div>
        </header>
        <main id="view" class="p-6 max-w-[1400px]"></main>
      </div>
    </div>
    <script type="module" src="/assets/admin/main.js"></script>
  </body>
</html>
